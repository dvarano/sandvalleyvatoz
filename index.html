<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Copa De Vatoz &middot; Sand Valley 2026</title>
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f9f9f7;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --pos:#006300; --neg:#d03b3b; --warn:#fab219;
  --accent:#2a78d6;
  --ring:rgba(11,11,11,0.10);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --surface-1:#1a1a19; --plane:#0d0d0d;
    --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
    --grid:#2c2c2a; --axis:#383835;
    --pos:#0ca30c; --neg:#d03b3b;
    --accent:#3987e5;
    --ring:rgba(255,255,255,0.10);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--plane); color:var(--ink-1);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
header{
  position:sticky; top:0; z-index:20;
  background:var(--surface-1); border-bottom:1px solid var(--ring);
  padding:10px 14px calc(10px) 14px;
}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-size:16px;margin:0;letter-spacing:-0.01em}
.brand span{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.rsel{display:flex;align-items:center;gap:5px;margin-top:8px}
.rsel select{
  flex:1 1 0;min-width:0;min-height:38px;font:inherit;font-size:14px;color:var(--ink-1);
  background:var(--plane);border:1px solid var(--ring);border-radius:8px;padding:0 8px;
}
.rsel button{
  flex:0 0 auto;width:34px;min-height:38px;font-size:17px;line-height:1;padding:0;
  background:var(--plane);color:var(--ink-1);border:1px solid var(--ring);border-radius:8px;
}
main{padding:14px;max-width:760px;margin:0 auto}
.card{
  background:var(--surface-1);border:1px solid var(--ring);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;
}
.card h2{font-size:12px;margin:0 0 10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.hero{font-size:26px;font-weight:600;letter-spacing:-0.02em;margin:0 0 2px}
.sub{color:var(--ink-2);font-size:13px;margin:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--grid);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600;font-variant-numeric:tabular-nums}
.pill{
  display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;
  border:1px solid var(--ring);color:var(--ink-2);background:var(--plane);
  text-transform:uppercase;letter-spacing:.05em;font-weight:600;
}
.pill.count{color:var(--accent);border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;text-align:right;font-weight:600;padding:0 0 6px}
th:first-child{text-align:left}
td{padding:7px 0;border-top:1px solid var(--grid);text-align:right;font-size:14px}
td:first-child{text-align:left}
.grp{border:1px solid var(--ring);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--plane)}
.grp h3{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between}
.grp h3 small{color:var(--ink-3);font-weight:400;font-variant-numeric:tabular-nums}
.grp ul{margin:0;padding-left:0;list-style:none}
.grp li{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.grp li span{color:var(--ink-3);font-variant-numeric:tabular-nums}
.entry{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--grid)}
.entry label{flex:1;font-size:14px}
.entry label em{font-style:normal;color:var(--ink-3);font-size:12px;display:block}
.entry input[type=number]{
  width:76px;min-height:42px;text-align:center;font:inherit;font-variant-numeric:tabular-nums;
  background:var(--plane);color:var(--ink-1);border:1px solid var(--ring);border-radius:8px;
}
.entry select{min-height:42px;font-size:12px;background:var(--plane);color:var(--ink-1);border:1px solid var(--ring);border-radius:8px;max-width:96px}
.delta{font-weight:600;font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.pos{color:var(--pos)} .neg{color:var(--neg)}
button.act{
  width:100%;min-height:46px;font:inherit;font-weight:600;border-radius:10px;
  background:var(--ink-1);color:var(--surface-1);border:0;margin-top:10px;
}
button.ghost{background:var(--plane);color:var(--ink-1);border:1px solid var(--ring)}
.chk{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chk label{
  display:flex;align-items:center;gap:5px;padding:8px 10px;border-radius:8px;
  border:1px solid var(--ring);background:var(--plane);font-size:13px;min-height:40px;
}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.chk label.off{opacity:.42}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;min-height:40px;font:inherit;font-size:13px;border-radius:8px;border:1px solid var(--ring);background:var(--plane);color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--ink-1);color:var(--surface-1);border-color:var(--ink-1);font-weight:600}
.bars{margin-top:4px}
.barrow{display:grid;grid-template-columns:64px 1fr 46px;align-items:center;gap:8px;padding:4px 0}
.barrow .nm{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:16px}
.track.noaxis::before{display:none}
.track::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--axis)}
.bar{position:absolute;top:2px;height:12px;background:var(--pos)}
.bar.l{background:var(--neg);border-radius:4px 0 0 4px}
.bar.r{border-radius:0 4px 4px 0}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:var(--surface-1);border-top:1px solid var(--ring);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;min-height:60px;background:none;border:0;color:var(--ink-3);
  font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
}
nav button b{font-size:16px;font-weight:400;line-height:1}
nav button[aria-selected=true]{color:var(--ink-1);font-weight:600}
.hide{display:none}
.note{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.note code{background:var(--plane);padding:1px 4px;border-radius:4px;font-size:12px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:80px;z-index:60;
  background:var(--ink-1);color:var(--surface-1);padding:10px 16px;border-radius:999px;
  font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.on{opacity:1}
.rules{font-size:13px;color:var(--ink-2);margin:0;padding-left:18px}
.rules li{margin:4px 0}
.seedrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--grid)}
.seedno{width:26px;height:26px;border-radius:999px;background:var(--ink-1);color:var(--surface-1);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto}
.matchcard{border:1px solid var(--ring);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--plane)}
.prow{border-top:1px solid var(--grid)}
.prow .entry{border-top:0;padding-bottom:2px}
.teeline{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:0 0 9px;font-size:11px;color:var(--ink-3)}
.teeline input{width:58px;min-height:34px;text-align:center;font:inherit;font-size:12px;font-variant-numeric:tabular-nums;background:var(--plane);color:var(--ink-1);border:1px solid var(--ring);border-radius:6px}
.teeline select{min-height:34px;font-size:12px;background:var(--plane);color:var(--ink-1);border:1px solid var(--ring);border-radius:6px;max-width:112px}
.teeline b{margin-left:auto;color:var(--ink-1);font-size:12px;font-variant-numeric:tabular-nums}
.asgn{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--grid)}
.asgn span{flex:1;font-size:14px}
.asgn span i{font-style:normal;color:var(--ink-3);font-size:12px}
.asgn select{min-height:40px;font:inherit;font-size:13px;background:var(--plane);color:var(--ink-1);border:1px solid var(--ring);border-radius:8px;min-width:112px}
.warn{color:var(--warn);font-weight:700}
/* Sync strip: last-updated for everyone, publish controls for the organiser. */
.syncbar{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:11.5px;color:var(--ink-3)}
.syncbar .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.syncbar .dot.ok{background:var(--pos)}
.syncbar .dot.err{background:var(--neg)}
.syncbar .dot.warn{background:var(--accent)}
.syncbar .dot.sync{background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.syncbar #syncTxt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.syncbar button{
  flex:none;min-height:28px;padding:0 9px;font:inherit;font-size:11.5px;font-weight:600;
  background:var(--plane);color:var(--ink-1);border:1px solid var(--ring);border-radius:7px;
}
.syncbar button.pub{background:var(--accent);color:#fff;border-color:transparent}
.syncbar button:disabled{opacity:.45}
.tokrow{display:flex;gap:6px;margin-top:8px}
.tokrow input{
  flex:1;min-width:0;min-height:38px;font:inherit;font-size:13px;padding:0 8px;
  background:var(--plane);color:var(--ink-1);border:1px solid var(--ring);border-radius:8px;
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1 id="brandName">La Copa De Vatoz</h1>
    <span>Sand Valley &middot; Oct 2026</span>
  </div>
  <div class="rsel">
    <button id="prevR" aria-label="Previous round">&#8249;</button>
    <select id="roundSel"></select>
    <button id="nextR" aria-label="Next round">&#8250;</button>
  </div>
  <div class="syncbar">
    <span class="dot" id="syncDot"></span>
    <span id="syncTxt">Loading&hellip;</span>
    <button id="refreshBtn">Refresh</button>
    <button id="pubBtn" class="pub hide">Publish</button>
  </div>
</header>

<main>
  <section id="v-today"></section>
  <section id="v-enter" class="hide"></section>
  <section id="v-stand" class="hide"></section>
  <section id="v-pair" class="hide"></section>
  <section id="v-info" class="hide"></section>
</main>

<nav>
  <button data-v="info" aria-selected="true"><b>&#8505;</b>Info</button>
  <button data-v="today" aria-selected="false"><b>&#9971;</b>Today</button>
  <button data-v="enter" aria-selected="false"><b>&#9998;</b>Enter</button>
  <button data-v="stand" aria-selected="false"><b>&#9733;</b>Standings</button>
  <button data-v="pair" aria-selected="false"><b>&#9783;</b>Pairings</button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   LA COPA VATOZ  —  Sand Valley 2026
   Single file. State lives in the URL hash, so the link IS the save file.
   To rename the competition, change TRIP_NAME below.
   ============================================================ */

const TRIP_NAME = "La Copa De Vatoz";
document.getElementById('brandName').textContent = TRIP_NAME;
document.title = TRIP_NAME + " · Sand Valley 2026";

/* ---------- Roster (edit indexes here) ---------- */
const P = [
  {n:'Matt',   idx:13},
  {n:'Drew',   idx:7},
  {n:'Mike',   idx:6},
  {n:'Tony',   idx:13},
  {n:'Brook',  idx:12},
  {n:'Eric',   idx:10},
  {n:'Ryan',   idx:14},
  {n:'Paul',   idx:8},
  {n:'Daniel', idx:9},
];
const NP = P.length;

/* ---------- Tees: [name, course rating, slope, par] ---------- */
const TEES = {
  links:      [['White', 72.0, 133, 72]],
  woodlands:  [['Blue', 71.6, 131, 72], ['White', 70.2, 128, 72]],
  sedge:      [['Back', 68.7, 130, 68], ['Back/Middle', 67.0, 126, 68]],
  mammoth:    [['Orange', 72.1, 136, 72], ['Orange/Sand', 71.1, 134, 72], ['Sand', 69.8, 131, 72]],
  sandvalley: [['Orange', 72.8, 138, 72], ['Orange/Sand', 71.4, 133, 72], ['Sand', 70.2, 129, 72]],
  sandbox:    null,
  commons:    null
};

/* ---------- The 8 rounds ---------- */
const R = [
 {id:'r1', day:'Sun Oct 4', sd:'Sun 10/4', when:'PM', course:'Lawsonia Links', sc:'Links', key:'links',      tees:'1:40 / 1:50',
  counts:false, tag:'El Qualifier', game:'Bingo Bango Bongo', out:[8], ng:2, pin:true,
  rules:['Warmup round. Everyone posts a gross score.','Committee (Drew + Matt) may adjust any index &plusmn;3 before Monday.','Does not count for Copa points. Sunday finish is the FIRST tiebreak for seeding.'],
  gamerules:['Points per hole: first on green, closest once all are on, first in the hole.','Order of play is honest &mdash; furthest away goes first.','No handicap math. Everyone still plays their own ball.']},

 {id:'r2', day:'Mon Oct 5', sd:'Mon 10/5', when:'AM', course:'Lawsonia Woodlands', sc:'Woodlands', key:'woodlands',  tees:'9:00 / 9:10',
  counts:true, tag:'Copa Round 1', game:'Six-Six-Six', out:[8], ng:2,
  rules:['Counts for La Copa.'],
  gamerules:['Partners rotate every 6 holes so each player partners each other player.','Holes 1&ndash;6, 7&ndash;12, 13&ndash;18. Best ball each segment.','Fresh money each segment.']},

 {id:'r3', day:'Mon Oct 5', sd:'Mon 10/5', when:'PM', course:'The Sandbox', sc:'Sandbox', key:'sandbox',    tees:'4:54 / 5:18',
  counts:false, tag:'Side Pot', game:'Gross skins + CTP', out:[], ng:2,
  rules:['17 par 3s at dusk. All nine play. Fivesomes confirmed OK here.','Separate buy-in, does not touch Copa standings.'],
  gamerules:['GROSS skins, no handicaps. Ties carry over.','Closest to the pin on every hole.','Expect a monster carryover on the closing holes.']},

 {id:'r4', day:'Tue Oct 6', sd:'Tue 10/6', when:'AM', course:'Sedge Valley', sc:'Sedge', key:'sedge',      tees:'8:30 / 8:40',
  counts:true, tag:'Copa Round 2', game:'Wolf', out:[4], ng:2,
  rules:['Counts for La Copa. Brook sits (no 36 Tuesday).','TIGHT TURN: at 4:15 pace you finish 12:45&ndash;12:55 and Mammoth is 12:50. Play fast.'],
  gamerules:['Rotating Wolf order, changes every hole.','Wolf tees off last, picks a partner after watching drives, or goes Lone Wolf for double.','Net scores. Best terrain on the trip for this game.']},

 {id:'r5', day:'Tue Oct 6', sd:'Tue 10/6', when:'PM', course:'Mammoth Dunes', sc:'Mammoth', key:'mammoth',    tees:'12:50 / 1:00',
  counts:true, tag:'Copa Round 3', game:'Four-ball Nassau', out:[1], ng:2,
  rules:['Counts for La Copa. Drew sits (he volunteered).','If a 3rd tee time lands, switch to three groups of three and everyone plays.'],
  gamerules:['2v2 better ball. Front, back, total.','Automatic press at 2 down.','Wide and birdie-able &mdash; be aggressive.']},

 {id:'r6', day:'Wed Oct 7', sd:'Wed 10/7', when:'AM', course:'Sedge Valley', sc:'Sedge', key:'sedge',      tees:'7:40 / 7:50',
  counts:true, tag:'Copa Round 4', game:'Nine Point / Six-Six-Six', out:[3], ng:2,
  rules:['Counts for La Copa. Tony sits (his no-36 day).','Pre-8am = resort speed slot, under 4 hours. You will finish ~11:40 with time to spare.'],
  gamerules:['THREESOMES: Nine Point. 9 points a hole &mdash; 5 best, 3 middle, 1 worst.','FOURSOMES: Six-Six-Six, partners rotate every 6 holes.','Net scores.']},

 {id:'r7', day:'Wed Oct 7', sd:'Wed 10/7', when:'PM', course:'Sand Valley', sc:'Sand Valley', key:'sandvalley', tees:'12:50 / 1:00',
  counts:true, tag:'Copa Round 5', game:'Vegas', out:[7], ng:2,
  rules:['Final counting round. Standings lock after this.','One player sits (placeholder: Paul). Must be someone who has not already taken a drop.'],
  gamerules:['2v2. Combine partners&rsquo; scores into a two-digit number, low digit first.','A birdie by the opposing side FLIPS your number. This is how people lose money.','Double stakes. It is the marquee round.']},

 {id:'r8', day:'Thu Oct 8', sd:'Thu 10/8', when:'AM', course:'The Commons', sc:'Commons', key:'commons',    tees:'8:00 / 8:10',
  counts:false, tag:'La Final', game:'Match play', out:[], ng:2,
  rules:['12 holes, par 45, 3,417 from the back tees.','8:00 &mdash; top 4 seeds. 8:10 &mdash; El Toilet Bowl.','Not USGA rated, so no quota here. Match strokes use the scorecard&rsquo;s own 65% rule.'],
  gamerules:['Match A: Seed 1 v Seed 2 for $500 / $300.','Match B: Seed 3 v Seed 4 for $200 / nothing.','Seeds 1 and 3 start 1 UP. All square after 12 &rarr; higher seed wins.']}
];

const COUNTING = R.filter(r=>r.counts).map(r=>r.id);
const ENTRY_FEE = 150;
const PRIZES = [700, 350, 300];

/* The Commons is not USGA rated (you cannot post a score there), so there is no
   slope or course rating to run through the normal formula. The scorecard itself
   prescribes 65% of your handicap for match allocation over the 12 holes. */
const COMMONS_PCT = 0.65;
const COMMONS_STROKE_HOLES = [12,9,4,10,3,11,2,6,5,8,1,7]; // holes, hardest first
function commonsHcp(idx){ return Math.round(COMMONS_PCT*idx); }

/* ---------- Golf math ---------- */
function chcp(idx, tee){ return Math.round(idx*tee[2]/113 + (tee[1]-tee[3])); }
function quotaFor(idx, tee){ return 36 - chcp(idx, tee); }
function teeFor(rd, pi){
  const list = TEES[rd.key]; if(!list) return null;
  const ov = S.t[rd.id] && S.t[rd.id][pi];
  if(ov && ov.length===2) return ['Custom', ov[0], ov[1], list[0][3]];
  return list[0];
}

/* ---------- State (compact, lives in the URL hash) ----------
   s: scores      {roundId:[9 values, null if blank]}
   t: tee choice  {roundId:[9 tee indexes]}
   p: pairings    {roundId:[[playerIdx...],[...]]}
   o: sit-outs    {roundId:[playerIdx...]}
   m: modified    epoch ms of the last user edit — decides hash-vs-remote
   l: ledger      [[playerIdx, amount, "note"], ...]
------------------------------------------------------------- */
const BLANK = {v:1, s:{}, t:{}, p:{}, o:{}, u:{}, m:0, l:[]};
let S = Object.assign({}, BLANK);

function encode(){
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(S)))).replace(/=+$/,''); }
  catch(e){ return ''; }
}
function decode(h){
  try{
    const j = decodeURIComponent(escape(atob(h)));
    const o = JSON.parse(j);
    if(o && o.v) return Object.assign({}, BLANK, o);
  }catch(e){}
  return null;
}
function save(){
  const h = encode();
  history.replaceState(null,'', location.pathname + location.search + '#' + h);
}
/* Every genuine user edit goes through edit(), not save(). It stamps S.m so the
   hash-vs-remote comparison on load has something to compare, and flags the
   board as having unpublished changes. Boot-time seeding calls save() directly
   so simply opening the page never looks like an edit. */
let dirty = false;
function edit(){ S.m = Date.now(); dirty = true; lastSyncErr = ''; save(); renderSync(); }
function load(){
  const h = location.hash.replace(/^#/,'');
  if(h){ const o = decode(h); if(o){ S = o; return true; } }
  return false;
}

/* ---------- Remote save layer (GitHub contents API) ----------
   The link still works and the hash is still written on every edit, so the app
   is fully usable with no token and no signal. On top of that, whoever holds a
   fine-grained token (contents:write, this repo only) can publish the board to
   data.json, and everyone else reads it from the same URL.

   Reads go through the contents API rather than the Pages URL or
   raw.githubusercontent.com because those are CDN-cached for minutes, which
   would feel broken when nine people refresh right after a round.

   Unauthenticated reads are 60/hour PER IP — and on resort wifi the whole group
   is behind one NAT, so that 60 is shared. Hence: refresh is manual, never
   polled, and a 403 says so plainly instead of blanking the board.
-------------------------------------------------------------- */
const REPO = {owner:'dvarano', name:'sandvalleyvatoz', path:'data.json', branch:'main'};
const TOKEN_KEY = 'copa_token';
const API = `https://api.github.com/repos/${REPO.owner}/${REPO.name}/contents/${REPO.path}`;
let remoteSha = null;

/* localStorage is wrapped because the app is also meant to run inside sandboxes
   that block it. If it throws, you simply get the read-only board. */
function getToken(){ try{ return localStorage.getItem(TOKEN_KEY) || ''; }catch(e){ return ''; } }
function setToken(t){
  try{ if(t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); return true; }
  catch(e){ return false; }
}
function isEditor(){ return !!getToken(); }
function b64(str){ return btoa(unescape(encodeURIComponent(str))); }
function unb64(str){ return decodeURIComponent(escape(atob(str.replace(/\s/g,'')))); }

function apiHeaders(){
  const h = {'Accept':'application/vnd.github+json'};
  const t = getToken(); if(t) h.Authorization = 'Bearer ' + t;
  return h;
}
/* Rate limiting is detected from the response body, not the x-ratelimit-remaining
   header: response headers are CORS-filtered, so the header is not reliably
   readable from the page. The body message always is. */
function rateLimited(r, body){
  if(r.headers.get('x-ratelimit-remaining') === '0') return true;
  try{ return /rate limit/i.test(JSON.parse(body).message || ''); }catch(e){ return false; }
}
async function remoteGet(){
  let r;
  try{
    r = await fetch(API + '?ref=' + REPO.branch + '&cb=' + Date.now(), {headers:apiHeaders(), cache:'no-store'});
  }catch(e){ throw new Error('no connection'); }
  if(r.status === 404) return {missing:true};
  if(r.status === 401) throw new Error('token rejected');
  if(r.status === 403){
    throw new Error(rateLimited(r, await r.text()) ? 'GitHub rate limit — wait a minute' : 'access denied');
  }
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  return {sha:j.sha, state:JSON.parse(unb64(j.content || ''))};
}
/* PUT needs the blob SHA of the file being replaced. A stale SHA (you published
   from your phone, then from a laptop that still held the old one) comes back
   409/422 — refetch and retry once. With a single editor the newest write
   winning is the behaviour we want. */
async function remotePut(){
  for(let attempt = 0; attempt < 2; attempt++){
    if(remoteSha === null){
      const cur = await remoteGet();
      remoteSha = cur.missing ? undefined : cur.sha;
    }
    const body = {
      message: 'Board update — ' + new Date().toISOString().replace('T',' ').slice(0,16) + 'Z',
      content: b64(JSON.stringify(S)),
      branch: REPO.branch
    };
    if(remoteSha) body.sha = remoteSha;
    let r;
    try{ r = await fetch(API, {method:'PUT', headers:apiHeaders(), body:JSON.stringify(body)}); }
    catch(e){ throw new Error('no connection'); }
    if(r.ok){ const j = await r.json(); remoteSha = j.content.sha; return; }
    if((r.status === 409 || r.status === 422) && attempt === 0){ remoteSha = null; continue; }
    if(r.status === 401) throw new Error('token rejected');
    if(r.status === 403) throw new Error('token lacks contents:write');
    throw new Error('HTTP ' + r.status);
  }
}

/* ---------- Sit-outs ---------- */
function sitOuts(rd){
  if(S.o[rd.id]) return S.o[rd.id].slice();
  return rd.out.slice();
}
function playing(rd){
  const out = sitOuts(rd);
  const a=[]; for(let i=0;i<NP;i++) if(out.indexOf(i)<0) a.push(i);
  return a;
}

/* ---------- Standings: drop your worst, average the rest ---------- */
function results(pi){
  const out=[];
  COUNTING.forEach(rid=>{
    const rd = R.find(r=>r.id===rid);
    if(sitOuts(rd).indexOf(pi)>=0) return;
    const row = S.s[rid];
    const v = row ? row[pi] : null;
    if(v===null||v===undefined||v==='') return;
    const t = teeFor(rd, pi);
    out.push({rid:rid, course:rd.course, pts:v, q:quotaFor(P[pi].idx,t), d:v - quotaFor(P[pi].idx,t)});
  });
  return out;
}
function standing(pi){
  const rs = results(pi);
  if(!rs.length) return {n:0, avg:null, dropped:null, rs:rs};
  if(rs.length===1) return {n:1, avg:rs[0].d, dropped:null, rs:rs};
  let wi=0; for(let i=1;i<rs.length;i++) if(rs[i].d < rs[wi].d) wi=i;
  let sum=0; for(let i=0;i<rs.length;i++) if(i!==wi) sum+=rs[i].d;
  return {n:rs.length, avg:sum/(rs.length-1), dropped:rs[wi], rs:rs};
}
function sundayDelta(pi){
  const rd = R[0], row = S.s[rd.id];
  if(!row) return null;
  const v = row[pi];
  if(v===null||v===undefined||v==='') return null;
  return v - quotaFor(P[pi].idx, teeFor(rd,pi));
}
function board(){
  const rows = P.map((p,i)=>{
    const st = standing(i);
    return {i:i, name:p.n, idx:p.idx, n:st.n, avg:st.avg, dropped:st.dropped, best:st.rs.length?Math.max.apply(null,st.rs.map(r=>r.d)):null, sun:sundayDelta(i)};
  });
  rows.sort((a,b)=>{
    if(a.avg===null && b.avg===null) return a.name.localeCompare(b.name);
    if(a.avg===null) return 1;
    if(b.avg===null) return -1;
    if(b.avg!==a.avg) return b.avg-a.avg;
    if(a.sun!==null && b.sun!==null && b.sun!==a.sun) return b.sun-a.sun;  // tiebreak 1: Sunday
    if(a.best!==null && b.best!==null && b.best!==a.best) return b.best-a.best; // tiebreak 2: best round
    return a.name.localeCompare(b.name);
  });
  return rows;
}

/* ---------- Pairing engine ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function sizesFor(n,g){
  const base=Math.floor(n/g), rem=n%g, out=[];
  for(let i=0;i<g;i++) out.push(base + (i<rem?1:0));
  return out.sort((a,b)=>b-a);
}
function historyUpTo(uptoIdx){
  const h={};
  for(let k=0;k<uptoIdx;k++){
    if(R[k].id==='r3') continue;            // Sandbox: whole group plays together
    const gs = S.p[R[k].id];
    if(!gs) continue;
    gs.forEach(g=>{ for(let a=0;a<g.length;a++) for(let b=a+1;b<g.length;b++){
      const key = Math.min(g[a],g[b])+'|'+Math.max(g[a],g[b]);
      h[key]=(h[key]||0)+1;
    }});
  }
  return h;
}
function scorePartition(groups, hist){
  let rep=0, means=[];
  groups.forEach(g=>{
    let s=0;
    for(let a=0;a<g.length;a++){
      s+=P[g[a]].idx;
      for(let b=a+1;b<g.length;b++){
        const c = hist[Math.min(g[a],g[b])+'|'+Math.max(g[a],g[b])]||0;
        rep += c*c;
      }
    }
    means.push(s/g.length);
  });
  const m = means.reduce((x,y)=>x+y,0)/means.length;
  let varr=0; means.forEach(x=>varr+=(x-m)*(x-m));
  return rep*12 + varr*1.0;
}
function generate(ids, sizes, hist, seed){
  const rnd = mulberry32(seed||1);
  let best=null, bestScore=Infinity;
  for(let it=0; it<6000; it++){
    const pool = ids.slice();
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=pool[i];pool[i]=pool[j];pool[j]=t; }
    const groups=[]; let k=0;
    sizes.forEach(sz=>{ groups.push(pool.slice(k,k+sz)); k+=sz; });
    const sc = scorePartition(groups, hist);
    if(sc<bestScore){ bestScore=sc; best=groups.map(g=>g.slice().sort((a,b)=>P[a].idx-P[b].idx)); }
  }
  return best;
}
/* Baseline grid, found by optimising all six grouped rounds jointly rather than
   round by round. Every one of the 36 possible pairs plays together at least
   once, nobody is paired more than three times, and no round has its two groups
   more than 2.0 apart in average index. Four constraints are pinned by request &mdash;
   Sunday's groups, Matt with Daniel on Tuesday morning (Daniel's first 18), and
   Matt/Daniel and Drew/Paul together at least twice each across the week
   &mdash; and the remaining rounds were optimised around those fixed points. The Sandbox is excluded (everyone plays
   it together) and Thursday follows the standings. Edit freely on the Pairings
   tab &mdash; the matrix there tracks what your changes do to those numbers. */
const BASE_SEED = 3;
const BASE_GRID = {"r1":[[2,5,4,6],[1,7,0,3]],"r2":[[6,7,5,1],[2,0,3,4]],
                   "r4":[[8,0,7,6],[5,1,2,3]],"r5":[[2,7,4,6],[8,0,3,5]],
                   "r6":[[8,1,6,4],[0,7,5,2]],"r7":[[6,8,3,2],[5,4,1,0]]};
/* Every round carrying a baseline grid starts locked, so a stray tap on
   auto-generate can't wipe a chosen pairing. Unlock per round on the Pairings
   tab. Manual moves are always allowed, locked or not. */
function isLocked(rd){ return !!BASE_GRID[rd.id] && !S.u[rd.id]; }
function defaultPairings(){
  R.forEach((rd,i)=>{
    if(S.p[rd.id]) return;
    if(rd.id==='r3' || rd.id==='r8') return;   // Sandbox is one big group; Thursday follows standings
    if(BASE_GRID[rd.id] && !S.o[rd.id]){
      S.p[rd.id] = BASE_GRID[rd.id].map(g=>g.slice().sort((a,b)=>P[a].idx-P[b].idx));
      return;
    }
    const ids = playing(rd);
    S.p[rd.id] = generate(ids, sizesFor(ids.length, ids.length>8?3:2), historyUpTo(i), BASE_SEED);
  });
}

function matchStrokes(a,b){
  const ha=commonsHcp(P[a.i].idx), hb=commonsHcp(P[b.i].idx), d=Math.abs(ha-hb);
  if(!d) return `<b>${a.name} v ${b.name}:</b> scratch, no strokes (both play to ${ha}).`;
  const gets = ha>hb ? a.name : b.name;
  const holes = COMMONS_STROKE_HOLES.slice(0,d).sort((x,y)=>x-y).map(x=>'#'+x).join(', ');
  return `<b>${a.name} v ${b.name}:</b> ${gets} gets ${d} stroke${d>1?'s':''} (${ha} v ${hb}) on hole${d>1?'s':''} ${holes}.`;
}

    <p class="note" style="margin-top:10px">One individual competition runs the whole trip. Every round can also have its own team game or bets within the foursome. As long as everyone plays their own ball, it won&rsquo;t interfere with the trip competition.</p>
  </div>`;

  h+=`<div class="card"><h2>The competition &mdash; the quota game</h2>
    <p class="note">You get a <b>quota</b> for every round: 36 minus your course handicap for the tee you actually play. Then you earn gross points as you go and try to beat it.</p>
    <table style="margin-top:10px"><thead><tr><th style="text-align:left">Score</th><th>Points</th></tr></thead><tbody>
      <tr><td style="text-align:left">Eagle</td><td><b>6</b></td></tr>
      <tr><td style="text-align:left">Birdie</td><td><b>4</b></td></tr>
      <tr><td style="text-align:left">Par</td><td><b>2</b></td></tr>
      <tr><td style="text-align:left">Bogey</td><td><b>1</b></td></tr>
      <tr><td style="text-align:left">Double or worse</td><td><b>0</b></td></tr>
    </tbody></table>
    <p class="note" style="margin-top:10px">Your result for the round is <b>points minus quota</b>. Beat your number and you are positive. Because the double-bogey floor is zero, <b>pick up</b> once a hole is gone &mdash; it costs you nothing and Sand Valley enforces a 4:15 pace.</p>
    <p class="note" style="margin-top:8px"><b>Default tees are listed</b> on the Today tab, but the quota target will be adjusted if different tees are played. Rating and slope are editable per player on the Enter tab.</p>
  </div>`;

  h+=`<div class="card"><h2>What counts</h2>
    <table><thead><tr><th style="text-align:left">Round</th><th>Counts?</th></tr></thead><tbody>`;
  R.forEach(rd=>{
    h+=`<tr><td style="text-align:left">${rd.course} <span style="color:var(--ink-3);font-size:12px">${rd.day.split(' ')[0]} ${rd.when}</span></td>
      <td style="font-size:12px;color:${rd.counts?'var(--accent)':'var(--ink-3)'}">${rd.counts?'YES':'No &mdash; '+rd.tag}</td></tr>`;
  });
  h+=`</tbody></table>
    <p class="note" style="margin-top:10px"><b>Five counting rounds.</b> Sunday is a warmup, the Sandbox is its own pot, and Thursday is the final.</p>
  </div>`;

  h+=`<div class="card"><h2>How standings work</h2>
    <p class="note"><b>Everyone drops their worst round (El Mulligan), then averages the rest.</b> Play five, average your best four. Play four, average your best three.</p>
    <p class="note" style="margin-top:8px">This exists because the round counts are uneven and cannot be made even: five counting rounds &times; eight tee-time slots is 40 player-rounds for nine players, so four of you play five rounds and five of you play four. Counting a fixed number instead would hand the five-round players a free discard the four-round players never get, worth over a point a round. Dropping one each way removes almost all of it.</p>
    <p class="note" style="margin-top:8px"><b>Corollary:</b> whoever sits Mammoth or Sand Valley must be someone playing all other rounds.</p>
  </div>`;

  h+=`<div class="card"><h2>Seeding &amp; La Final</h2>
    <ul class="rules">
      <li><b>Sunday at Lawsonia</b> is warmup only. It does not award points. It sets adjusted indexes (the committee may move any index &plusmn;3 before Monday) and it is the <b>first tiebreak</b> for seeding. Second tiebreak is your best single round.</li>
      <li><b>Top 4 after Wednesday</b> tee at 8:00 Thursday at the Commons.</li>
      <li>Seed 1 v Seed 2 for <b>$${PRIZES[0]} / $${PRIZES[1]}</b>. Seed 3 v Seed 4 for <b>$${PRIZES[2]}</b>.</li>
      <li><b>Seeds 1 and 3 start 1 up.</b> All square after 12 &rarr; split the prizes, or agree on a playoff, chip-off or putt-off.</li>
      <li>The Commons is not USGA rated, so there is no quota and no course handicap. Strokes come off the scorecard&rsquo;s own <b>65% of index</b> rule, allocated hardest hole first.</li>
      <li>Everyone else plays <b>El Toilet Bowl</b> at 8:10.</li>
    </ul>
  </div>`;

  h+=`<div class="card"><h2>How pairings work</h2>
    <p class="note">Groups are re-drawn every round and are <b>fully editable by hand</b> on the Pairings tab. Auto-generate balances the groups by handicap while favouring partners you have not played with yet; then move anyone you like. The matrix at the bottom of that tab tracks who still has not played with whom and updates with every change.</p>
    <p class="note" style="margin-top:8px">All eight grouped rounds start <b>locked</b>, so auto-generate cannot wipe a pairing by accident. Moving people by hand always works; unlock a round only if you want it re-drawn from scratch.</p>
  </div>`;

  h+=`<div class="card"><h2>Money</h2>
    <ul class="rules">
      <li><b>La Copa:</b> $${ENTRY_FEE} each, pays $${PRIZES[0]} / $${PRIZES[1]} / $${PRIZES[2]}. Nine buy-ins funds it exactly.</li>
      <li><b>Each round can have its own separate money game within the foursome.</b> See the Today tab for ideas for formats.</li>
      <li><b>The Sandbox</b> (Monday dusk) is a separate pot: gross skins with carryovers, plus closest to the pin on all 17. No handicaps.</li>
    </ul>
  </div>`;

  h+=`<div class="card"><h2>Using this page</h2>
    <ul class="rules">
      <li><b>Bookmark this URL.</b> It does not change. Drew publishes the board after each round &mdash; hit <b>Refresh</b> at the top to pull the latest.</li>
      <li>The header line tells you <b>when the board was last published</b>, so you always know whether you are looking at current numbers.</li>
      <li><b>One scorekeeper.</b> Drew enters the scores; everyone else reads. Quota is self-tallying, so you know your own number walking off 18.</li>
      <li>Refresh by hand rather than leaving it open &mdash; on shared wifi the whole group shares one GitHub rate limit.</li>
    </ul>
    <p class="note" style="margin-top:10px"><a href="#" id="orgToggle" style="color:var(--accent)">Organiser access</a></p>
    <div id="orgBox" class="hide">
      <p class="note" style="margin-top:6px">Paste a fine-grained GitHub token (this repo only, <b>contents: read and write</b>). It is stored on this device only and never leaves it except to publish.</p>
      <div class="tokrow">
        <input type="password" id="tokIn" placeholder="github_pat_&hellip;" autocomplete="off" spellcheck="false">
        <button class="act" id="tokSave" style="width:auto;padding:0 12px;margin:0">Save</button>
      </div>
      <p class="note" style="margin-top:6px" id="tokState"></p>
    </div>
  </div>`;

  $('#v-info').innerHTML=h;

  const box=$('#orgBox'), st=$('#tokState');
  const showState=()=>{ st.innerHTML = isEditor()
    ? 'Token stored on this device. <a href="#" id="tokClear" style="color:var(--accent)">Remove it</a>'
    : 'No token on this device &mdash; read-only.';
    const c=$('#tokClear');
    if(c) c.addEventListener('click',e=>{ e.preventDefault(); setToken(''); $('#tokIn').value=''; showState(); applyMode(); render(); toast('Token removed'); });
  };
  showState();
  $('#orgToggle').addEventListener('click',e=>{ e.preventDefault(); box.classList.toggle('hide'); });
  $('#tokSave').addEventListener('click',()=>{
    const v=$('#tokIn').value.trim();
    if(!v){ toast('Paste a token first'); return; }
    if(!setToken(v)){ toast('This browser blocks storage'); return; }
    $('#tokIn').value=''; showState(); applyMode(); render();
    toast('Token saved'); pull(true);
  });
}

function renderPair(){
  const rd=R[cur];
  if(rd.id==='r3'){
    $('#v-pair').innerHTML=`<div class="card"><h2>${esc(rd.course)}</h2>
      <p class="note">All nine play the Sandbox together and fivesomes are fine, so there is nothing to pair. It is also excluded from the partner tracking below, since &ldquo;played with&rdquo; means nothing when everyone is out there at once.</p></div>`;
    return;
  }
  const gs=(S.p[rd.id]||[]), ng=Math.max(2, gs.length||2);
  const asg=new Array(NP).fill(-1);
  gs.forEach((g,gi)=>g.forEach(pi=>asg[pi]=gi));
  const counts=new Array(ng).fill(0); asg.forEach(g=>{ if(g>=0&&g<ng) counts[g]++; });

  let h=`<div class="card"><h2>Groups &mdash; ${esc(rd.course)}</h2>
    <p class="note" style="margin-bottom:8px">Set anyone by hand. Everything below, including the partner counts, updates as you change it.</p>`;
  P.forEach((p,i)=>{
    let opts=`<option value="-1"${asg[i]<0?' selected':''}>Sitting</option>`;
    for(let g=0;g<ng;g++) opts+=`<option value="${g}"${asg[i]===g?' selected':''}>Group ${g+1}</option>`;
    h+=`<div class="asgn"><span>${p.n} <i>${p.idx}</i></span><select data-asg="${i}">${opts}</select></div>`;
  });
  const over=counts.some((c,i)=>c>4);
  const locked = isLocked(rd);
  h+=`<div class="seg" style="margin-top:12px">
      <button data-ng="2" aria-pressed="${ng===2}">2 groups</button>
      <button data-ng="3" aria-pressed="${ng===3}">3 groups</button></div>
    <p class="note">${counts.map((c,i)=>`Group ${i+1}: ${c}`).join(' &middot; ')} &middot; sitting ${asg.filter(x=>x<0).length}
      ${over?'<br><span class="warn">A group has more than 4. You will need another tee time.</span>':''}</p>`;
  if(locked){
    h+=`<p class="note" style="margin-top:10px"><span class="pill">Locked</span> This round is set to the baseline grid${rd.id==='r1'?' you picked for Sunday':(rd.id==='r4'?', with Matt and Daniel paired as requested':'')}. You can still move people by hand above; auto-generate is disabled so it can&rsquo;t wipe it.</p>
        <button class="act ghost" id="unlock">Unlock auto-generate</button></div>`;
  } else {
    h+=`<button class="act" id="gen">Auto-generate</button>
        <button class="act ghost" id="reroll">Try another arrangement</button></div>`;
  }

  const hist=historyUpTo(R.indexOf(rd));
  if(gs.filter(g=>g.length).length){
    h+=`<div class="card"><h2>Preview</h2>`;
    gs.forEach((g,i)=>{
      if(!g.length) return;
      const avg=(g.reduce((s,x)=>s+P[x].idx,0)/g.length).toFixed(1);
      let rep=0;
      for(let a=0;a<g.length;a++) for(let b=a+1;b<g.length;b++) rep+=hist[Math.min(g[a],g[b])+'|'+Math.max(g[a],g[b])]||0;
      h+=`<div class="grp"><h3>Group ${i+1} <small>avg idx ${avg}${rep?` &middot; ${rep} repeat${rep>1?'s':''}`:' &middot; all new'}</small></h3><ul>`;
      g.forEach(pi=>h+=`<li>${P[pi].n}<span>${P[pi].idx}</span></li>`);
      h+=`</ul></div>`;
    });
    h+=`</div>`;
  }

  const all=historyUpTo(R.length), vals=Object.values(all);
  const met=Object.keys(all).length, worst=vals.length?Math.max.apply(null,vals):0;
  h+=`<div class="card"><h2>Who has played with whom</h2><table><thead><tr><th style="text-align:left"></th>${P.map(p=>`<th style="text-align:center;font-size:10px">${p.n.slice(0,2)}</th>`).join('')}</tr></thead><tbody>`;
  P.forEach((p,i)=>{
    h+=`<tr><td style="text-align:left;font-size:12px">${p.n}</td>`;
    P.forEach((q2,j)=>{
      if(i===j){ h+=`<td style="text-align:center;color:var(--grid)">&middot;</td>`; return; }
      const c=all[Math.min(i,j)+'|'+Math.max(i,j)]||0;
      const col = c===0 ? 'var(--neg)' : (c>3 ? 'var(--warn)' : 'var(--ink-1)');
      h+=`<td style="text-align:center;font-size:12px;color:${col};font-weight:${c===0||c>3?'700':'400'}">${c||'0'}</td>`;
    });
    h+=`</tr>`;
  });
  h+=`</tbody></table>
    <p class="note" style="margin-top:8px"><b>${met}/36</b> pairs have played together, worst repeat <b>${worst}</b>. A red <b>0</b> is a pair who never meet; amber is four or more. The Sandbox is excluded because everyone plays it together.</p></div>`;

  $('#v-pair').innerHTML=h;

  const apply=(a,n)=>{
    const groups=[]; for(let i=0;i<n;i++) groups.push([]);
    const out=[];
    a.forEach((g,pi)=>{ if(g<0||g>=n) out.push(pi); else groups[g].push(pi); });
    S.p[rd.id]=groups.map(g=>g.sort((x,y)=>P[x].idx-P[y].idx));
    S.o[rd.id]=out;
    edit(); renderPair(); renderToday();
  };
  $('#v-pair').querySelectorAll('[data-asg]').forEach(el=>el.addEventListener('change',()=>{
    const a=asg.slice(); a[+el.dataset.asg]=+el.value; apply(a,ng);
  }));
  $('#v-pair').querySelectorAll('[data-ng]').forEach(b=>b.addEventListener('click',()=>{
    const n=+b.dataset.ng, a=asg.map(g=>g>=n?-1:g); apply(a,n);
  }));
  const doGen=(seed)=>{
    const ids=playing(rd);
    S.p[rd.id]=generate(ids, sizesFor(ids.length,ng), historyUpTo(R.indexOf(rd)), seed);
    edit(); renderPair(); renderToday();
  };
  if(locked){
    $('#unlock').addEventListener('click',()=>{ S.u[rd.id]=1; edit(); renderPair(); });
  } else {
    $('#gen').addEventListener('click',()=>doGen(BASE_SEED));
    $('#reroll').addEventListener('click',()=>doGen(Math.floor(Math.random()*1e9)));
  }
}

/* ---------- Chrome ---------- */
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1600); }
function copyLink(){
  save();
  const u=location.href;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(u).then(()=>toast('Link copied'),()=>toast('Saved. Copy from the address bar.'));
  } else toast('Saved. Copy from the address bar.');
}

/* ---------- Sync UI ---------- */
function ago(ms){
  if(!ms) return 'never';
  const s = Math.max(0, Math.round((Date.now() - ms)/1000));
  if(s < 45) return 'just now';
  const m = Math.round(s/60);  if(m < 60) return m + ' min ago';
  const h = Math.round(m/60);  if(h < 24) return h + ' hr' + (h>1?'s':'') + ' ago';
  const d = Math.round(h/24);  return d + ' day' + (d>1?'s':'') + ' ago';
}
function setSync(state, msg, title){
  const dot = $('#syncDot'), txt = $('#syncTxt');
  if(!dot) return;
  dot.className = 'dot' + (state ? ' ' + state : '');
  txt.textContent = msg;
  txt.title = title || '';
}
/* The header line everyone sees. Viewers get when the board was last published;
   the organiser also gets the state of their own unpublished edits. */
function renderSync(){
  const pub = $('#pubBtn'); if(pub) pub.classList.toggle('hide', !isEditor());
  if(syncBusy) return;
  const when = S.m ? new Date(S.m).toLocaleString() : '';
  /* Errors outrank the dirty flag: a failed publish IS unpublished changes, but
     only the error tells you why, so it must not be masked by the milder note. */
  if(lastSyncErr) setSync('err', lastSyncErr, '');
  else if(isEditor() && dirty) setSync('warn', 'Unpublished changes', when);
  else if(!S.m) setSync('', 'No board published yet', '');
  else setSync('ok', 'Updated ' + ago(S.m), when);
}
let syncBusy = false, lastSyncErr = '';

/* Pull the published board. Local unpublished edits are never clobbered, and a
   hash newer than the remote copy (someone shared a link after the last
   publish) wins too — otherwise opening a fresh link would silently roll back. */
async function pull(manual){
  if(syncBusy) return;
  syncBusy = true; lastSyncErr = '';
  setSync('sync', manual ? 'Refreshing…' : 'Checking…');
  try{
    const r = await remoteGet();
    if(r.missing){
      remoteSha = undefined; syncBusy = false;
      lastSyncErr = isEditor() ? 'No board published yet — press Publish' : 'No board published yet';
      renderSync(); return;
    }
    remoteSha = r.sha;
    const remoteM = (r.state && r.state.m) || 0, localM = S.m || 0;
    if(dirty && localM >= remoteM){
      syncBusy = false; renderSync();
      if(manual) toast('You have unpublished changes');
      return;
    }
    if(remoteM >= localM){
      S = Object.assign({}, BLANK, r.state);
      dirty = false;
      defaultPairings();
      save();
      syncBusy = false; renderSync(); render();
      if(manual) toast('Board updated');
      return;
    }
    syncBusy = false; renderSync();
    if(manual) toast('Your copy is newer');
  }catch(e){
    syncBusy = false; lastSyncErr = e.message; renderSync();
    if(manual) toast(e.message);
  }
}
async function publish(){
  if(!isEditor() || syncBusy) return;
  syncBusy = true;
  setSync('sync', 'Publishing…');
  $('#pubBtn').disabled = true;
  try{
    S.m = Date.now(); save();
    await remotePut();
    dirty = false; lastSyncErr = '';
    syncBusy = false; renderSync();
    toast('Published');
  }catch(e){
    syncBusy = false; lastSyncErr = 'Publish failed — ' + e.message; renderSync();
    toast('Publish failed');
  }
  $('#pubBtn').disabled = false;
}
/* Without a token the Enter and Pairings tabs are not rendered, so the other
   eight get a clean read-only board on the same URL. This is tidiness, not
   security — the real guard is that publishing needs the token, so an unhidden
   tab only ever edits that person's own copy. */
function applyMode(){
  const ed = isEditor();
  document.querySelectorAll('nav button').forEach(b=>{
    if(b.dataset.v === 'enter' || b.dataset.v === 'pair') b.classList.toggle('hide', !ed);
  });
  if(!ed && (view === 'enter' || view === 'pair')) view = 'info';
  renderSync();
}
function render(){
  renderRoundSel();
  ['today','enter','stand','pair','info'].forEach(v=>$('#v-'+v).classList.toggle('hide', v!==view));
  document.querySelector('.rsel').classList.toggle('hide', view==='stand' || view==='info');
  if(view==='today') renderToday();
  if(view==='enter') renderEnter();
  if(view==='stand') renderStand();
  if(view==='pair')  renderPair();
  if(view==='info')  renderInfo();
}
function syncNav(){ document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected', x.dataset.v===view?'true':'false')); }
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{
  view=b.dataset.v;
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected', x===b?'true':'false'));
  window.scrollTo(0,0); render();
}));
$('#refreshBtn').addEventListener('click',()=>pull(true));
$('#pubBtn').addEventListener('click',publish);
$('#roundSel').addEventListener('change',e=>{ cur=+e.target.value; render(); });
$('#prevR').addEventListener('click',()=>{ cur=Math.max(0,cur-1); render(); });
$('#nextR').addEventListener('click',()=>{ cur=Math.min(R.length-1,cur+1); render(); });

/* ---------- Boot ---------- */
(function(){
  load();
  // Pick the round matching today's date if we are on the trip.
  const today=new Date(), y=today.getFullYear(), m=today.getMonth(), d=today.getDate();
  if(y===2026 && m===9 && d>=4 && d<=8){
    const day=['Sun Oct 4','Mon Oct 5','Tue Oct 6','Wed Oct 7','Thu Oct 8'][d-4];
    const pm=today.getHours()>=12;
    let i=R.findIndex(r=>r.day===day && (r.when===(pm?'PM':'AM')));
    if(i<0) i=R.findIndex(r=>r.day===day);
    if(i>=0){ cur=i; view='today'; }
  }
  defaultPairings();
  save();
  syncNav();
  applyMode();
  render();
  pull(false);                       // async; re-renders if the published board is newer
  setInterval(renderSync, 60000);    // keeps "Updated 12 min ago" honest without polling GitHub
})();
</script>
